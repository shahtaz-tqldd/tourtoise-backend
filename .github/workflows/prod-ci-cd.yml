deploy:
  name: Deploy production
  needs: ci
  runs-on: ubuntu-latest
  if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
  environment: production

  env:
    PROD_HOST: ${{ secrets.PROD_HOST }}
    PROD_USER: ${{ secrets.PROD_USER }}
    PROD_PORT: ${{ secrets.PROD_PORT }}
    PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
    PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

  steps:
    - name: Configure SSH
      run: |
        if [ -z "$PROD_HOST" ]; then
          echo "Missing PROD_HOST"
          exit 1
        fi

        if [ -z "$PROD_USER" ]; then
          echo "Missing PROD_USER"
          exit 1
        fi

        if [ -z "$PROD_PORT" ]; then
          echo "Missing PROD_PORT"
          exit 1
        fi

        if [ -z "$PROD_APP_DIR" ]; then
          echo "Missing PROD_APP_DIR"
          exit 1
        fi

        if [ -z "$PROD_SSH_KEY" ]; then
          echo "Missing PROD_SSH_KEY"
          exit 1
        fi

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_deploy_key
        chmod 600 ~/.ssh/prod_deploy_key
        ssh-keyscan -p "$PROD_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts

    - name: Deploy with Docker Compose
      run: |
        ssh -i ~/.ssh/prod_deploy_key -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
          "PROD_APP_DIR='$PROD_APP_DIR' bash -s" <<'REMOTE'
        set -euo pipefail

        cd "$PROD_APP_DIR"

        git fetch origin prod
        git checkout prod
        git reset --hard origin/prod

        docker compose -p tourtoise-core-prod --env-file .env -f docker/compose.prod.yml up --build -d

        docker image prune -f
        REMOTE