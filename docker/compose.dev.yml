services:
  wsgi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ../.env
    environment:
      APP_ENV: dev
      DJANGO_RUN_MIGRATIONS: "1"
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-tourtoise_db_owner}:${DB_PASSWORD:-tourtoise_db_password}@postgres:5432/adk_session_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
      - ../secrets/service-account.json:/app/secrets/service-account.json:ro
    ports:
      - "${WSGI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tourtoise-dev

  asgi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8001 --reload
    env_file:
      - ../.env
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-tourtoise_db_owner}:${DB_PASSWORD:-tourtoise_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ..:/app
    ports:
      - "${ASGI_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tourtoise-dev

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app worker -l info
    env_file:
      - ../.env
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-tourtoise_db_owner}:${DB_PASSWORD:-tourtoise_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tourtoise-dev

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app beat -l info
    env_file:
      - ../.env
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-tourtoise_db_owner}:${DB_PASSWORD:-tourtoise_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tourtoise-dev

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-tourtoise_db}
      POSTGRES_USER: ${DB_USER:-tourtoise_db_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tourtoise_db_password}
      POSTGRES_ADDITIONAL_DATABASES: adk_session_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init-additional-databases.sh:/docker-entrypoint-initdb.d/10-create-additional-databases.sh:ro
    ports:
      - "${POSTGRES_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tourtoise_db_owner} -d ${DB_NAME:-tourtoise_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      tourtoise-dev:
        aliases:
          - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      tourtoise-dev:
        aliases:
          - redis

volumes:
  postgres_dev_data:

networks:
  tourtoise-dev:
    driver: bridge
